<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12355B">
  <title>Malaybalay City Hall</title>
  <link rel="stylesheet" href="/shared/tokens.css">
  <style>
    body { font-size: 16px; line-height: 1.5; }
    .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--brand-navy); color: #fff; }
    .top b { display: block; font-size: 15px; } .top small { opacity: .75; font-size: 12px; }
    .top .back { color: #fff; display: grid; place-items: center; width: 40px; height: 40px; margin-left: -8px; }
    .seal { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-gold); color: var(--brand-navy); display: grid; place-items: center; font-weight: 800; font-size: 12px; flex: none; }
    main { padding: 16px 16px 48px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 24px; line-height: 1.25; margin: 4px 0 0; } h2 { font-size: 18px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
    p { margin: 0; } .muted { color: var(--text-secondary); } .small { font-size: 14px; }
    section { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 16px; padding: 16px; }
    .where { display: flex; gap: 10px; align-items: flex-start; background: var(--brand-sky); color: var(--brand-navy); padding: 12px 14px; border-radius: 14px; text-decoration: none; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stats div { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 14px; padding: 12px; color: var(--brand-blue); }
    .stats small { display: block; color: var(--text-secondary); font-weight: 600; } .stats b { color: var(--text-primary); font-size: 15px; }
    .count { background: var(--brand-grass-tint); color: var(--status-success); font-size: 13px; border-radius: 99px; padding: 1px 10px; }
    .check { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .check label { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--bg-subtle); cursor: pointer; min-height: 48px; }
    .check input { width: 24px; height: 24px; flex: none; accent-color: var(--status-success); margin-top: 1px; }
    .check input:checked + span b { text-decoration: line-through; color: var(--text-secondary); }
    .check small, .steps small { display: block; color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
    .steps, .dirs { margin: 8px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
    .plan { width: 100%; height: auto; margin: 6px 0 8px; }
    .btn { display: inline-flex; gap: 8px; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--border-strong); background: #fff; font-weight: 700; color: var(--text-primary); text-decoration: none; font-size: 15px; }
    .row { display: flex; gap: 10px; } .row.wrap { flex-wrap: wrap; } .row .btn { flex: 1; }
    .contact { display: flex; flex-direction: column; gap: 8px; }
    .search { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--border-strong); border-radius: 14px; padding: 0 14px; color: var(--text-secondary); }
    .search input { border: 0; outline: 0; flex: 1; min-height: 52px; font-size: 16px; background: none; }
    .results { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    .results a { display: block; background: #fff; border: 1px solid var(--border-default); border-radius: 12px; padding: 12px 14px; color: var(--text-primary); text-decoration: none; }
    .results small { display: block; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div id="app"><p style="padding:24px">Loading…</p></div>
  <script type="module" src="/m/app.js"></script>
</body>
</html>
